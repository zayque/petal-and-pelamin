name: petal-pelamin

services:
  db:
    image: mysql:8.4
    container_name: petal-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpetal}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-petal_pelamin}
      MYSQL_USER: ${MYSQL_USER:-petal}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-petalpass}
      TZ: Asia/Kuala_Lumpur
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-grants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  adminer:
    image: adminer:5
    container_name: petal-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    container_name: petal-app
    restart: unless-stopped
    profiles: ["app"]
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-petal}:${MYSQL_PASSWORD:-petalpass}@db:3306/${MYSQL_DATABASE:-petal_pelamin}
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@petalpelamin.my}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      UPLOAD_DIR: /app/storage/uploads
      # set to 0 once you serve the app behind HTTPS
      INSECURE_COOKIES: "1"
    volumes:
      - uploads:/app/storage/uploads
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads:
